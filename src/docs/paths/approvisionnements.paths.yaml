paths:
  /approvisionnements:
    get:
      tags: [Approvisionnements]
      summary: Lister les approvisionnements
      operationId: listAppros
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: statut
          in: query
          schema:
            type: string
            enum: [BROUILLON, VALIDEE, ANNULEE]
        - name: Four_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste des approvisionnements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppros'

    post:
      tags: [Approvisionnements]
      summary: Créer un approvisionnement
      operationId: createAppro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApproDto'
      responses:
        '201':
          description: Approvisionnement créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Approvisionnement'

  /approvisionnements/{id}:
    get:
      tags: [Approvisionnements]
      summary: Récupérer un approvisionnement
      operationId: getApproById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approvisionnement trouvé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Approvisionnement'
        '404':
          description: Introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /approvisionnements/{id}/statut:
    patch:
      tags: [Approvisionnements]
      summary: Changer le statut
      operationId: updateApproStatut
      description: |
        ### Transitions autorisées
        | Statut actuel | → Statut cible | Effet |
        |---|---|---|
        | BROUILLON | VALIDEE | Crédit stock + recalcul prixAchatMoyen |
        | BROUILLON | ANNULEE | Rien |
        | VALIDEE | ANNULEE | Débit stock |
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApproStatutDto'
      responses:
        '200':
          description: Statut mis à jour
        '409':
          description: Transition invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'