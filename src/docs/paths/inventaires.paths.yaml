paths:
  /inventaires:
    get:
      tags: [Inventaires]
      summary: Lister les inventaires
      operationId: listInventaires
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: statut
          in: query
          schema:
            type: string
            enum: [EN_COURS, VALIDE, ANNULE]
      responses:
        '200':
          description: Liste des inventaires
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventaires'

    post:
      tags: [Inventaires]
      summary: Créer un inventaire
      operationId: createInventaire
      description: |
        Un seul inventaire EN_COURS autorisé à la fois.
        Les quantités théoriques sont calculées automatiquement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventaireDto'
      responses:
        '201':
          description: Inventaire créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Inventaire'
        '409':
          description: Un inventaire EN_COURS existe déjà
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inventaires/{id}:
    get:
      tags: [Inventaires]
      summary: Récupérer un inventaire
      operationId: getInventaireById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventaire trouvé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Inventaire'

  /inventaires/{id}/statut:
    patch:
      tags: [Inventaires]
      summary: Valider ou annuler un inventaire
      operationId: updateInventaireStatut
      description: |
        ### Transitions autorisées
        | Statut actuel | → Statut cible | Effet |
        |---|---|---|
        | EN_COURS | VALIDE | Génère MouvementStock AJUSTEMENT |
        | EN_COURS | ANNULE | Rien |
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statut]
              properties:
                statut:
                  type: string
                  enum: [VALIDE, ANNULE]
      responses:
        '200':
          description: Statut mis à jour
        '409':
          description: Transition invalide